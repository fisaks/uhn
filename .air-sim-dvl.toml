root = "."
tmp_dir = "tmp"

[build]
cmd = 'CGO_ENABLED=0 go build -gcflags=all="-N -l" -o tmp/mb-sim ./cmd/tools/mb-sim'
full_bin = "dlv exec tmp/mb-sim --listen=127.0.0.1:2346 --headless=true --api-version=2 --accept-multiclient --continue --log --"
bin = "tmp/mb-sim"

include_ext = ["go","json"]
include_dir = ["cmd/tools/mb-sim", "internal/simulator", "internal/config","config"]
exclude_dir = ["tmp", "vendor"]
pre_cmd = ["jq --arg port \"$SIM_PORT\" '.buses[0].port = $port' $SIM_BASE_CONFIG > $SIM_CONFIG_PATH"]
